# Fly.io alternative — see README. Replace the app name, then:
#   fly launch --no-deploy   (accept the settings, it will use this file)
#   fly secrets set TRUCK1_PIN=... TRUCK2_PIN=... TRUCK3_PIN=... ADMIN_PIN=...
#   fly deploy
app = "canadian-lakes-plow-tracker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
